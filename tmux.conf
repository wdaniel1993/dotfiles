# ============================================================================
# tmux Configuration
# Designed to complement WezTerm (no keybinding conflicts)
# ============================================================================
# WezTerm uses: Ctrl+Shift+* and Alt+Arrow
# tmux uses:    Ctrl+A prefix (avoids Ctrl+B which conflicts with shell navigation)
# ============================================================================

# --- Prefix: Ctrl+A (easier to reach than Ctrl+B) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # True color support
set -g mouse on                                    # Mouse support (scrolling, pane select, resize)
set -g history-limit 50000                         # Generous scrollback
set -g base-index 1                                # Windows start at 1
setw -g pane-base-index 1                          # Panes start at 1
set -g renumber-windows on                         # Renumber on close
set -g set-clipboard on                            # System clipboard integration
set -sg escape-time 0                              # No delay on Esc (important for Vim)
set -g focus-events on                             # Pass focus events to apps
set -g display-time 3000                           # Status messages last 3s

# --- Splits (same logic as WezTerm: d=horizontal, e=vertical) ---
bind d split-window -h -c "#{pane_current_path}"
bind e split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# --- Pane Navigation: Alt+Arrow (same as WezTerm, no prefix needed) ---
# These won't conflict because WezTerm only intercepts Alt+Arrow locally,
# and tmux only sees them inside an SSH session
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Pane Resizing: prefix + Arrow ---
bind -r Left resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# --- Window Navigation ---
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# Quick window select: prefix + 1-9 (default, just confirming)
# Swap windows with < and >
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# --- Session Management ---
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

# --- Convenience ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind z resize-pane -Z                              # Zoom toggle (same key as WezTerm)
bind x kill-pane                                   # Close pane (no confirmation)

# --- Copy Mode (Vi style) ---
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard 2>/dev/null || pbcopy 2>/dev/null || clip.exe 2>/dev/null"
bind -T copy-mode-vi Escape send -X cancel

# --- Catppuccin Mocha Theme (matching WezTerm) ---

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Status bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60

# Status left: session name
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e] "

# Status right: host + time
set -g status-right "#[fg=#585b70]│ #[fg=#a6adc8]#H #[fg=#585b70]│ #[fg=#a6adc8]%H:%M "

# Window tabs
set -g window-status-format "#[fg=#585b70]  #I:#W  "
set -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold]  #I:#W  "
set -g window-status-separator ""

# Messages
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Clock (prefix + t)
setw -g clock-mode-colour "#cba6f7"
